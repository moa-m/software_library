</style></head><body><main><header><h1>NUUPAMO LP 素材一覧</h1><p class="intro">承認済みデザイン用の写真・実画面・端末モックです。画像を選ぶと配信用ファイルを開けます。人物写真の薄さ、見出し、ボタン、料金表はLP実装時に調整します。</p><p><a href="README.md">配置・利用方法</a> · <a href="../../../images/nuupamo/lp/manifest.json">寸法・容量・出典一覧</a></p></header><section><h2>写真</h2><div class="grid photos"><figure><a href="../../../images/nuupamo/lp/hero-woman-home.webp"><div class="image"><img src="../../../images/nuupamo/lp/hero-woman-home.webp?v=71d26413e9f9" alt="白いニットと濃いグレーのパンツで、自宅でやや左を向いてスマートフォンを確認する女性" width="1024" height="1536" loading="lazy"></div></a><figcaption><strong>hero-woman-home.webp</strong><span>1024 × 1536 px · 123.8 KB</span><p>白いニットと濃いグレーのパンツで、自宅でやや左を向いてスマートフォンを確認する女性</p></figcaption></figure><figure><a href="../../../images/nuupamo/lp/hero-man-shopping.webp"><div class="image"><img src="../../../images/nuupamo/lp/hero-man-shopping.webp?v=c5a4c2f28b36" alt="整えた短髪としわの少ないブルーグレーのシャツで、買い物先でやや右を向いてスマートフォンを確認する男性" width="1024" height="1536" loading="lazy"></div></a><figcaption><strong>hero-man-shopping.webp</strong><span>1024 × 1536 px · 135.9 KB</span><p>整えた短髪としわの少ないブルーグレーのシャツで、買い物先でやや右を向いてスマートフォンを確認する男性</p></figcaption></figure><figure><a href="../../../images/nuupamo/lp/story-at-home.webp"><div class="image"><img src="../../../images/nuupamo/lp/story-at-home.webp?v=ce749e736e75" alt="洗面台と蛇口のそばで、ハンドソープのボトルを手に取って確認する様子" width="1000" height="1000" loading="lazy"></div></a><figcaption><strong>story-at-home.webp</strong><span>1000 × 1000 px · 66.0 KB</span><p>洗面台と蛇口のそばで、ハンドソープのボトルを手に取って確認する様子</p></figcaption></figure><figure><a href="../../../images/nuupamo/lp/story-at-store.webp"><div class="image"><img src="../../../images/nuupamo/lp/story-at-store.webp?v=4e479884b298" alt="ヒーローと同じ無地のブルーグレーのシャツで、日用品売場でスマートフォンを確認する手元" width="1000" height="1000" loading="lazy"></div></a><figcaption><strong>story-at-store.webp</strong><span>1000 × 1000 px · 54.9 KB</span><p>ヒーローと同じ無地のブルーグレーのシャツで、日用品売場でスマートフォンを確認する手元</p></figcaption></figure><figure><a href="../. ></figcaption></figure><figure><a href="../../../images/nuupamo/lp/screen-android-members.webp"><div class="image"><img src="../../../images/nuupamo/lp/screen-android-members.webp?v=0b6a55cff886" alt="Androidのメンバー画面。瑞希、悠斗、その他のメンバーのももを表示" width="1080" height="2400" loading="lazy"></div></a><figcaption><strong>screen-android-members.webp</strong><span>1080 × 2400 px · 109.1 KB</span><p>Androidのメンバー画面。瑞希、悠斗、その他のメンバーのももを表示</p></figcaption></figure></div></section><section><h2>端末モック</h2><div class="grid "><figure><a href="../../../images/nuupamo/lp/phone-ios-shopping.webp"><div class="image"><img src="../../../images/nuupamo/lp/phone-ios-shopping.webp?v=9f60d6949733" alt="iPhoneの端末枠に収めたNUUPAMOの買うもの一覧" width="760" height="1560" loading="lazy"></div></a><figcaption><strong>phone-ios-shopping.webp</strong><span>760 × 1560 px · 105.8 KB</span><p>iPhoneの端末枠に収めたNUUPAMOの買うもの一覧</p></figcaption></figure><figure><a href="../../../images/nuupamo/lp/phone-android-shopping.webp"><div class="image"><img src="../../../images/nuupamo/lp/phone-android-shopping.webp?v=ecb1bbae0e40" alt="Androidの端末枠に収めたNUUPAMOの買うもの一覧" width="760" height="1601" loading="lazy"></div></a><figcaption><strong>phone-android-shopping.webp</strong><span>760 × 1601 px · 116.9 KB</span><p>Androidの端末枠に収めたNUUPAMOの買うもの一覧</p></figcaption></figure><figure><a href="../../../images/nuupamo/lp/phone-android-members.webp"><div class="image"><img src="../../../images/nuupamo/lp/phone-android-members.webp?v=db0ca66f5bd1" alt="Androidの端末枠に収めたNUUPAMOのメンバー画面" width="760" height="1601" loading="lazy"></div></a><figcaption><strong>phone-android-members.webp</strong><span>760 × 1601 px · 98.7 KB</span><p>Androidの端末枠に収めたNUUPAMOのメンバー画面</p></figcaption></figure></div></section><section><h2>実画面の部分</h2><div class="grid "><figure><a href="../../../images/nuupamo/lp/item-handsoap-memo.webp"><div class="image"><img src="../../../images/nuupamo/lp/item-handsoap-memo.webp?v=2586f9329cda" alt="ハンドソープの買い物カード。赤髪の担当者、買い物メモ「ミントがなかったらピーチ」を表示" width
